name: Atualizar notícias

on:
  schedule:
    # Roda a cada 6 horas (em UTC). Ajuste se quiser outra frequência.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install feedparser

      - name: Buscar notícias
        run: python fetch_news.py

      - name: Commitar news.json atualizado (se houve mudança)
        run: |
          git config user.name "radar-ia-bot"
          git config user.email "actions@github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Atualiza notícias automaticamente"
          git push
